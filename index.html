<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reframe</title>
<meta name="description" content="An interactive reframing exercise: name a belief, surface what supports it, invert it, and arrive at a new belief." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #ffffff;
    --ink: #2b241c;
    --muted: #7a6f60;
    --border: #e5dccb;
    --primary: #F07F6C;
    --flip: #238CE7;
    --shadow: 0 1px 2px rgba(40,30,20,.05), 0 12px 40px rgba(40,30,20,.06);
    --page-pad: clamp(1rem, 4vw, 2.5rem);
    --section-gap: clamp(1.5rem, 4vw, 3.5rem);
    --stack-gap: clamp(1rem, 3vw, 1.75rem);
    --circle: clamp(11rem, 34vw, 18.75rem);
    --circle-md: clamp(8.75rem, 24vw, 13.75rem);
    --circle-pad: clamp(1.15rem, 3vw, 2rem);
    --circle-pad-md: clamp(.9rem, 2.25vw, 1.375rem);
    --circle-font: clamp(1rem, 1.35vw, 1.125rem);
    --circle-font-md: clamp(.88rem, 1.15vw, .94rem);
    --compass-size: clamp(6.4rem, 21vw, 13.75rem);
    --compass-gap: clamp(.9rem, 3.5vw, 2.25rem);
    --button-pad-y: clamp(.7rem, 1.4vw, .9rem);
    --button-pad-x: clamp(1rem, 3vw, 1.4rem);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-width: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    background-image: radial-gradient(rgba(40,30,20,.10) 1px, transparent 1px);
    background-size: 22px 22px;
  }
  h1, h2 { font-family: "Fraunces", Georgia, serif; letter-spacing: -.01em; margin: 0; font-weight: 500; }
  button { font: inherit; cursor: pointer; }
  textarea, input { font: inherit; color: inherit; }

  .wrap {
    width: min(100%, 70rem);
    margin: 0 auto;
    padding: var(--page-pad);
    min-height: 100svh;
    display: flex;
    flex-direction: column;
  }
  header .eyebrow {
    font-family: ui-monospace, monospace;
    font-size: clamp(.65rem, 1vw, .7rem);
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0;
  }

  .intro {
    width: min(100%, 45rem);
    margin-top: var(--section-gap);
  }
  .intro p {
    color: var(--muted);
    font-size: clamp(1rem, 2vw, 1.125rem);
    margin: 0;
    line-height: 1.5;
  }
  .intro strong {
    display: block;
    color: var(--ink);
    font-weight: 600;
    margin-bottom: .45rem;
  }

  .stage {
    margin-top: var(--section-gap);
    flex: 1;
    display: grid;
    place-items: start center;
    width: 100%;
  }
  .stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--stack-gap);
    width: 100%;
  }
  .row2 {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(1rem, 4vw, 2rem);
    align-items: center;
    justify-content: center;
    width: 100%;
  }

  /* CIRCLES — outline style, white inside, text vertically centered */
  .circle {
    inline-size: var(--circle);
    aspect-ratio: 1;
    border-radius: 50%;
    background: #ffffff;
    display: grid;
    place-items: center;
    padding: var(--circle-pad);
    box-shadow: var(--shadow);
    border: clamp(.12rem, .35vw, .19rem) solid var(--border);
    flex: 0 0 auto;
  }
  .circle.md {
    inline-size: var(--circle-md);
    padding: var(--circle-pad-md);
  }
  .circle.primary { border-color: var(--primary); }
  .circle.flip { border-color: var(--flip); }
  .circle.primary.filled { background: var(--primary); border-color: var(--primary); }
  .circle.flip.filled { background: var(--flip); border-color: var(--flip); }
  .circle.filled textarea, .circle.filled p { color: #fff; }
  .circle.filled textarea::placeholder { color: rgba(255,255,255,.7); }
  .circle textarea, .circle p {
    width: 100%;
    background: transparent; border: 0; outline: 0; resize: none;
    text-align: center; color: var(--ink); line-height: 1.35; margin: 0; padding: 0;
    display: block;
    font-family: inherit;
    overflow-wrap: anywhere;
  }
  .circle textarea {
    font-size: var(--circle-font);
    overflow: hidden;
    align-self: center;
    min-height: 1lh;
  }
  .circle.md textarea, .circle.md p { font-size: var(--circle-font-md); }
  .circle textarea::placeholder { color: rgba(43,36,28,.35); }
  .circle.selectable { cursor: pointer; transition: transform .15s ease, box-shadow .15s ease; }
  .circle.selectable:hover { transform: translateY(-2px); }
  .circle.selectable.selected { background: var(--flip); }
  .circle.selectable.selected p { color: #fff; }
  .circle.editable.entering {
    animation: circleEnter .24s ease-out both;
  }
  @keyframes circleEnter {
    from { opacity: 0; transform: scale(.965); }
    to { opacity: 1; transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .circle.editable.entering { animation: none; }
  }

  .hint {
    color: var(--muted);
    font-size: clamp(.85rem, 1.6vw, .9rem);
    margin: 0;
    text-align: center;
  }
  .encourage {
    font-family: "Fraunces", Georgia, serif;
    font-size: clamp(1.1rem, 2vw, 1.25rem);
    color: var(--ink);
    margin: 0;
    text-align: center;
  }

  .grid2x2 {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: clamp(1rem, 4vw, 2.5rem);
    align-items: center;
    justify-items: center;
    width: min(100%, 45rem);
  }

  .compass {
    display: grid;
    grid-template-columns: repeat(3, var(--compass-size));
    grid-template-rows: repeat(3, var(--compass-size));
    gap: var(--compass-gap);
    place-content: center;
    place-items: center;
    width: min(100%, calc(var(--compass-size) * 3 + var(--compass-gap) * 2));
    max-width: 100%;
  }
  .compass .circle {
    inline-size: var(--compass-size);
    padding: clamp(.8rem, 2.2vw, 1.375rem);
  }
  .compass .north { grid-area: 1 / 2; }
  .compass .east { grid-area: 2 / 3; }
  .compass .south { grid-area: 3 / 2; }
  .compass .west { grid-area: 2 / 1; }
  .compass .center { grid-area: 2 / 2; }
  .compass .center.circle { transition: inline-size .22s ease, block-size .22s ease; }
  .compass .center.circle textarea { transition: height .22s ease; }

  /* pick chips */
  .pick {
    width: min(100%, 40rem);
    display: flex;
    flex-direction: column;
    gap: clamp(.6rem, 1.5vw, .75rem);
  }
  .pick .chip {
    border: 1px solid var(--border); background: #fff; border-radius: 1rem;
    padding: clamp(.8rem, 2vw, .9rem) clamp(1rem, 2.4vw, 1.125rem);
    font-size: clamp(.9rem, 1.4vw, .94rem);
    text-align: left; color: var(--ink);
    transition: all .15s ease; display: flex; align-items: center; gap: 12px;
  }
  .pick .chip .dot {
    width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); flex: 0 0 20px;
  }
  .pick .chip.selected { border-color: var(--flip); background: #eef6fe; }
  .pick .chip.selected .dot { background: var(--flip); border-color: var(--flip); }

  footer {
    margin-top: var(--section-gap);
    padding-top: clamp(1rem, 3vw, 1.5rem);
    border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  footer .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .btn {
    border-radius: 999px;
    padding: var(--button-pad-y) var(--button-pad-x);
    min-height: 2.75rem;
    font-size: clamp(.88rem, 1.3vw, .95rem);
    font-weight: 500;
    border: 1px solid var(--border); background: #fff; color: var(--ink);
    transition: opacity .15s, background .15s;
  }
  .btn:hover { background: #faf6ec; }
  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.primary:hover { opacity: .9; background: var(--ink); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  .before-after {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(1rem, 5vw, 2.5rem);
    align-items: center;
    justify-content: center;
    width: 100%;
  }
  .before-after .arrow {
    font-size: clamp(1.5rem, 4vw, 1.75rem);
    color: var(--muted);
  }

  @media (max-width: 520px) {
    :root {
      --circle: min(82vw, 18rem);
      --circle-md: min(43vw, 10rem);
      --compass-size: min(26vw, 6.75rem);
      --compass-gap: clamp(.55rem, 2.5vw, .8rem);
      --circle-font-md: clamp(.72rem, 3vw, .82rem);
    }
    .wrap { padding-block: 1rem 1.25rem; }
    .stage { place-items: center; }
    .row2 { gap: .9rem; }
    footer {
      align-items: stretch;
    }
    footer .actions,
    footer .btn {
      width: 100%;
    }
    .actions { order: 1; }
    #backBtn { order: 2; }
    .before-after .arrow {
      width: 100%;
      text-align: center;
      transform: rotate(90deg);
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">A reframing exercise</p>
  </header>

  <section class="intro">
    <p id="stepPrompt"></p>
  </section>

  <section class="stage" id="stage"></section>

  <footer>
    <button class="btn" id="backBtn">Back</button>
    <div class="actions" id="actions"></div>
  </footer>
</div>

<script>
/* ================= state ================= */
const state = {
  phase: "core",        // core | support | supportsReview | opposite | oppositePick | newCore | final
  core: "",
  supports: [],         // finalized supporting beliefs (up to 4)
  currentSupport: "",
  sIdx: 0,              // which support we're working on in opposites phase
  opposites: [[], [], [], []],   // per support: array of finalized opposite strings
  chosenOpposite: [-1, -1, -1, -1], // chosen index per support
  currentOpposite: "",
  reframed: "",
};
const history = []; // stack of phase snapshots for Back

/* ================= prompts ================= */
function currentPrompt() {
  switch (state.phase) {
    case "core":
      return {
        bold: "What belief about yourself or a situation may be holding you back?",
        regular: "For example: \"I am not good at my job\""
      };
    case "support":
      if (state.supports.length === 0)
        return {
          bold: "What makes you think this is true? If real facts come to mind, think about how you interpret them to support your core belief.",
          regular: "For example: \"I failed yesterday's workshop\". How does that prove that I am not good at my job? \u2192 \"Good facilitators always have perfect workshops\"."
        };
      return {
        bold: "What else do you believe?",
        regular: ""
      };
    case "supportsReview":
      return {
        bold: "Well done!",
        regular: "Next you are going to find the opposite of each statement. Try to make it extreme even if it does not feel true. Write as many opposites as you can think of."
      };
    case "opposite": {
      return {
        bold: "Write opposites of this statement.",
        regular: "For example: \"Good facilitators always have perfect workshops\" \u2192 \"Good facilitators always make terrible workshops\"."
      };
    }
    case "oppositePick":
      return {
        bold: "See what you got \u2014 choose the one that feels most right.",
        regular: ""
      };
    case "newCore":
      return {
        bold: "If all these statements were true, what would be your new core belief?",
        regular: ""
      };
    case "final":
      return {
        bold: "Good job!",
        regular: "This is your new core belief. How does it feel?"
      };
  }
  return { bold: "", regular: "" };
}

/* ================= helpers ================= */
const $ = (s) => document.querySelector(s);
const stageEl = $("#stage");

function autoGrow(t){
  t.style.height = "auto";
  t.style.height = t.scrollHeight + "px";
}

/* ---- Center-circle auto-fit (newCore phase only) ----
   The center circle grows only when the textarea's content no longer fits
   inside the current content box. It does not shrink on normal typing, because
   shrinking changes the textarea width, rewraps the text, and can create a
   shrink/grow feedback loop. Clearing the text resets the circle to its CSS
   base size.

   Root cause of the old grow/shrink/grow flicker: the circle's inline-size
   and block-size are CSS-transitioned (for a smooth animated grow). Reading
   textarea.scrollHeight while that transition is still in flight measures
   the textarea against whatever *intermediate* width the box happens to be
   at that instant, not its settled width — so the same text could measure
   as needing more or less height from one keystroke to the next, even
   though nothing about the content actually changed. That instability is
   also what left the text hugging the top: its height kept getting locked
   to a stale, mid-transition measurement instead of the box's real size.

   The fix is to always measure against the circle's settled *target*
   content width (never the live, possibly-animating rendered width), by
   temporarily pinning the textarea to that exact width before reading
   scrollHeight. This makes the fit decision deterministic regardless of
   where the CSS animation currently is. */
function getBaseDiameter(circle) {
  if (circle._baseDiameter == null) {
    const inlineSize = circle.style.inlineSize, blockSize = circle.style.blockSize;
    circle.style.inlineSize = ""; circle.style.blockSize = "";
    circle._baseDiameter = circle.getBoundingClientRect().width;
    circle.style.inlineSize = inlineSize; circle.style.blockSize = blockSize;
  }
  return circle._baseDiameter;
}
function applyDiameter(circle, diameter) {
  circle._diameter = diameter;
  circle.style.inlineSize = diameter ? diameter + "px" : "";
  circle.style.blockSize = diameter ? diameter + "px" : "";
}
// Measures the height the textarea's content needs at a specific width,
// independent of whatever width its ancestor is currently rendering at
// (which may still be mid CSS-transition from a previous grow).
function measureHeightAtWidth(textarea, widthPx) {
  const prevWidth = textarea.style.width;
  const prevHeight = textarea.style.height;
  textarea.style.width = widthPx + "px";
  textarea.style.height = "auto";
  const height = textarea.scrollHeight;
  textarea.style.width = prevWidth;
  textarea.style.height = prevHeight;
  return height;
}
function fitCircleToText(circle, textarea) {
  const base = getBaseDiameter(circle);
  const needsReset = !textarea.value.trim();

  if (needsReset) {
    applyDiameter(circle, 0);
    autoGrow(textarea);
    return;
  }

  const cs = getComputedStyle(circle);
  // Both padding and border eat into the content box; the diameter (border-box)
  // must have both subtracted to know how much room the text actually has.
  const chromeY =
    parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom) +
    parseFloat(cs.borderTopWidth) + parseFloat(cs.borderBottomWidth);

  const current = circle._diameter || base;
  const contentWidth = current - chromeY;
  const contentBoxHeight = current - chromeY;

  const needed = measureHeightAtWidth(textarea, contentWidth);

  if (needed <= contentBoxHeight + 1) {
    // Fits already — just set the textarea to its actual required height.
    textarea.style.height = needed + "px";
    return;
  }

  const nextDiameter = Math.max(base, Math.ceil(needed + chromeY));
  applyDiameter(circle, nextDiameter);
  textarea.style.height = needed + "px";
}
function circleInput({tone, value, onInput, size, autofocus, filled, grow}) {
  const c = document.createElement("div");
  c.className = "circle editable entering " + tone + (size === "md" ? " md" : "") + (filled ? " filled" : "");
  const t = document.createElement("textarea");
  t.value = value; t.placeholder = "type"; t.rows = 1;
  t.addEventListener("input", (e) => {
    onInput(e.target.value);
    autoGrow(t);
    if (grow) fitCircleToText(c, t);
    updateInlineControls();
    updateActions();
  });
  c.appendChild(t);
  setTimeout(() => { autoGrow(t); if (grow) fitCircleToText(c, t); if (autofocus) t.focus(); }, 0);
  return c;
}
function circleStatic({tone, text, size, filled}) {
  const c = document.createElement("div");
  c.className = "circle " + tone + (size === "md" ? " md" : "") + (filled ? " filled" : "");
  const p = document.createElement("p"); p.textContent = text;
  c.appendChild(p);
  return c;
}

/* ================= render ================= */
function render() {
  const prompt = currentPrompt();
  $("#stepPrompt").replaceChildren();
  if (prompt.bold) {
    const strong = document.createElement("strong");
    strong.textContent = prompt.bold;
    $("#stepPrompt").appendChild(strong);
  }
  if (prompt.regular) {
    $("#stepPrompt").appendChild(document.createTextNode(prompt.regular));
  }
  stageEl.innerHTML = "";

  if (state.phase === "core") {
    const w = document.createElement("div"); w.className = "stack";
    w.appendChild(circleInput({
      tone: "primary", value: state.core,
      onInput: v => state.core = v,
      autofocus: true, filled: true,
    }));
    stageEl.appendChild(w);
  }

  else if (state.phase === "support") {
    const w = document.createElement("div"); w.className = "stack";
    const row = document.createElement("div"); row.className = "row2";
    row.appendChild(circleStatic({ tone: "primary", size: "md", text: state.core, filled: true }));
    row.appendChild(circleInput({
      tone: "primary", size: "md",
      value: state.currentSupport,
      onInput: v => state.currentSupport = v,
      autofocus: true,
    }));
    w.appendChild(row);
    if (state.supports.length >= 1) {
      const enc = document.createElement("p");
      enc.className = "encourage";
      enc.textContent = "Keep them coming.";
      w.appendChild(enc);
    }
    const hint = document.createElement("p");
    hint.className = "hint";
    hint.textContent = `${state.supports.length} of 4 so far`;
    w.appendChild(hint);
    stageEl.appendChild(w);
  }

  else if (state.phase === "supportsReview") {
    const w = document.createElement("div"); w.className = "stack";
    const row = document.createElement("div"); row.className = "row2";
    // core in the middle-ish, supports around — simple grid of 4
    state.supports.forEach(s => row.appendChild(circleStatic({ tone: "primary", size: "md", text: s })));
    w.appendChild(row);
    stageEl.appendChild(w);
  }

  else if (state.phase === "opposite") {
    const w = document.createElement("div"); w.className = "stack";
    const row = document.createElement("div"); row.className = "row2";
    row.appendChild(circleStatic({ tone: "primary", size: "md", text: state.supports[state.sIdx] }));
    row.appendChild(circleInput({
      tone: "flip", size: "md",
      value: state.currentOpposite,
      onInput: v => { state.currentOpposite = v; },
      autofocus: true,
    }));
    w.appendChild(row);

    // "Add another opposite" button right under the circles
    const addWrap = document.createElement("div");
    addWrap.className = "actions";
    const addBtn = document.createElement("button");
    addBtn.type = "button"; addBtn.className = "btn primary";
    addBtn.dataset.addOpposite = "true";
    addBtn.textContent = "Add another opposite";
    addBtn.disabled = !state.currentOpposite.trim();
    addBtn.onclick = () => {
      if(!state.currentOpposite.trim()) return;
      saveHistory();
      state.opposites[state.sIdx].push(state.currentOpposite.trim());
      state.currentOpposite = "";
      render();
      const ta=document.querySelector('.circle.flip textarea');
      if(ta) ta.focus();
    };
    addWrap.appendChild(addBtn);
    w.appendChild(addWrap);

    const hint = document.createElement("p");
    hint.className = "hint";
    hint.textContent = `Supporting belief ${state.sIdx + 1} of 4 · ${state.opposites[state.sIdx].length} opposite${state.opposites[state.sIdx].length===1?"":"s"} saved`;
    w.appendChild(hint);
    stageEl.appendChild(w);
  }

  else if (state.phase === "oppositePick") {
    const w = document.createElement("div"); w.className = "stack";
    const row = document.createElement("div"); row.className = "row2";
    state.opposites[state.sIdx].forEach((text, i) => {
      const c = circleStatic({ tone: "flip", size: "md", text });
      c.classList.add("selectable");
      if (state.chosenOpposite[state.sIdx] === i) c.classList.add("selected");
      c.addEventListener("click", () => {
        state.chosenOpposite[state.sIdx] = (state.chosenOpposite[state.sIdx] === i ? -1 : i);
        render();
      });
      row.appendChild(c);
    });
    w.appendChild(row);
    stageEl.appendChild(w);
  }

  else if (state.phase === "newCore") {
    const w = document.createElement("div"); w.className = "stack";
    const grid = document.createElement("div");
    grid.className = "compass";
    const pos=["north","east","south","west"];
    for(let i=0;i<4;i++){
      const opp=state.opposites[i][state.chosenOpposite[i]]||"";
      const c=circleStatic({tone:"flip",size:"md",text:opp});
      c.classList.add(pos[i]);
      grid.appendChild(c);
    }
    const center=circleInput({
      tone:"flip",filled:true,value:state.reframed,
      onInput: v => state.reframed = v,
      autofocus:true, grow:true});
    center.classList.add("center");
    grid.appendChild(center);
    w.appendChild(grid);
    stageEl.appendChild(w);
  }

  else if (state.phase === "final") {
    const row = document.createElement("div"); row.className = "before-after";
    row.appendChild(circleStatic({ tone: "primary", size:"md", text: state.core, filled: true }));
    const a = document.createElement("div"); a.className = "arrow"; a.textContent = "→";
    row.appendChild(a);
    row.appendChild(circleStatic({ tone: "flip", size:"md", text: state.reframed, filled: true }));
    stageEl.appendChild(row);
  }

  updateActions();
}

/* ================= footer actions (contextual) ================= */
function saveHistory() {
  history.push(JSON.parse(JSON.stringify({
    phase: state.phase, supports: state.supports, currentSupport: state.currentSupport,
    sIdx: state.sIdx, opposites: state.opposites, chosenOpposite: state.chosenOpposite,
    currentOpposite: state.currentOpposite, reframed: state.reframed, core: state.core,
  })));
}
function goBack() {
  const prev = history.pop();
  if (!prev) return;
  Object.assign(state, prev);
  render();
}

function updateActions() {
  const actions = $("#actions");
  actions.innerHTML = "";
  $("#backBtn").disabled = history.length === 0;

  const addBtn = (label, primary, disabled, onClick) => {
    const b = document.createElement("button");
    b.className = "btn" + (primary ? " primary" : "");
    b.textContent = label;
    b.disabled = !!disabled;
    b.onclick = onClick;
    actions.appendChild(b);
    return b;
  };

  if (state.phase === "core") {
    addBtn("Continue", true, !state.core.trim(), () => {
      saveHistory();
      state.phase = "support"; state.currentSupport = "";
      render();
    });
  }

  else if (state.phase === "support") {
    const canSave = !!state.currentSupport.trim();
    addBtn("Continue", true, !canSave, () => {
      saveHistory();
      state.supports.push(state.currentSupport.trim());
      state.currentSupport = "";
      if (state.supports.length >= 4) {
        state.phase = "supportsReview";
      }
      render();
    });
  }

  else if (state.phase === "supportsReview") {
    addBtn("Continue", true, false, () => {
      saveHistory();
      state.phase = "opposite"; state.sIdx = 0; state.currentOpposite = "";
      render();
    });
  }

  else if (state.phase === "opposite") {
    const has = !!state.currentOpposite.trim();
    const savedCount = state.opposites[state.sIdx].length;
    const isLastSupport = state.sIdx === 3;

    const totalAfter = savedCount + (has ? 1 : 0);
    let label;
    if (totalAfter >= 2) label = "See what you got — choose one";
    else label = isLastSupport ? "Continue" : "Next supporting belief";

    const canMove = totalAfter >= 1;
    // De-emphasize "Next supporting belief" so the user is invited to add
    // more opposites via the primary "Add another opposite" button instead.
    const footerPrimary = totalAfter >= 2;
    addBtn(label, footerPrimary, !canMove, () => {
      saveHistory();
      if (has) {
        state.opposites[state.sIdx].push(state.currentOpposite.trim());
        state.currentOpposite = "";
      }
      if (state.opposites[state.sIdx].length >= 2) {
        state.phase = "oppositePick";
      } else {
        state.chosenOpposite[state.sIdx] = 0;
        advanceFromSupport();
      }
      render();
    });
  }

  else if (state.phase === "oppositePick") {
    const chosen = state.chosenOpposite[state.sIdx] >= 0;
    const isLast = state.sIdx === 3;
    addBtn(isLast ? "Continue" : "Next supporting belief", true, !chosen, () => {
      saveHistory();
      advanceFromSupport();
      render();
    });
  }

  else if (state.phase === "newCore") {
    addBtn("Continue", true, !state.reframed.trim(), () => {
      saveHistory();
      state.phase = "final";
      render();
    });
  }

  else if (state.phase === "final") {
    addBtn("Start over", true, false, () => {
      Object.assign(state, {
        phase: "core", core: "", supports: [], currentSupport: "",
        sIdx: 0, opposites: [[], [], [], []], chosenOpposite: [-1,-1,-1,-1],
        currentOpposite: "", reframed: "",
      });
      history.length = 0;
      render();
    });
  }
}

function updateInlineControls() {
  const addOpposite = document.querySelector("[data-add-opposite]");
  if (addOpposite) addOpposite.disabled = !state.currentOpposite.trim();
}

function advanceFromSupport() {
  if (state.sIdx >= 3) {
    state.phase = "newCore";
  } else {
    state.sIdx += 1;
    state.currentOpposite = "";
    state.phase = "opposite";
  }
}

$("#backBtn").onclick = goBack;

render();
</script>
</body>
</html>
